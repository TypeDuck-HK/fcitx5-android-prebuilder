name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      ABI: "armeabi-v7a,arm64-v8a,x86,x86_64"
      NDK_VERSION: "28.0.13004108"
      CMAKE_VERSION: "3.31.6"
      ANDROID_PLATFORM: "23"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"

    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --needed --noconfirm \
            git openssh unzip jre-openjdk jq \
            ghc cabal-install haskell-shake haskell-aeson-pretty \
            cmake extra-cmake-modules ninja python boost boost-libs zstd

      - name: Fetch source code
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Fetch required Rime plugin
        run: |
          git config --global --add safe.directory '*'
          git -C librime submodule update --init plugins/rime-dictionary-lookup-filter

      - name: Fetch TypeDuck prebuilts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v6
        with:
          path: prebuilt
          repository: TypeDuck-HK/fcitx-android-cpp-prebuilt
          ssh-key: ${{ secrets.PREBUILT_SSH_KEY }}

      - name: Verify prebuilt publishing access
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: prebuilt
        run: git push --dry-run origin HEAD

      - name: Setup Android NDK
        uses: android-actions/setup-android@v4
        with:
          packages: "ndk;${{ env.NDK_VERSION }} cmake;${{ env.CMAKE_VERSION }}"

      - name: Build everything
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: |
          cabal configure --disable-library-vanilla --enable-shared --enable-executable-dynamic --ghc-options=-dynamic
          ./build-cabal -j4 everything

      - name: Pack prebuilt libraries
        if: github.event_name == 'pull_request'
        run: |
          cd build
          mkdir prebuilt
          while read -r TARGET
          do
            cp -a "$TARGET" prebuilt/
          done < artifacts.txt
          tar --zstd -cf prebuilt.tar.zst prebuilt/

      - name: Upload prebuilt to artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          path: build/prebuilt.tar.zst
          archive: false

      - name: Update TypeDuck prebuilts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: prebuilt
        run: |
          rm -r ./*
          while read -r TARGET
          do
            cp -a "../build/$TARGET" ./
          done < ../build/artifacts.txt
          git config user.name "Fcitx5 Android Bot"
          git config user.email "102923727+fcitx5-android-bot@users.noreply.github.com"
          git config diff.toolchain.textconv 'jq -S "del(.prebuilder)"'
          mkdir -p .git/info
          echo 'toolchain-versions.json diff=toolchain' >> .git/info/attributes
          git add .
          # Compute the content diff: Don't add --quiet and --name-only as they bypass textconv.
          if [ -z "$(git diff --cached --textconv)" ]; then
            echo "Already up to date."
            exit 0
          fi
          source_revision=$(git -C .. rev-parse HEAD)
          git commit -m "Generate TypeDuck native dependencies from $source_revision"
          git push --set-upstream origin "HEAD:main" --follow-tags --atomic
